<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    
    .loader {
      border: 3px solid #f3f3f3;
      border-radius: 50%;
      border-top: 3px solid #3b82f6;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Scrollbar Custom */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748b; }

    /* Animations */
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .slide-in { animation: slideIn 0.3s ease-out; }
    @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* Toast Animations */
    @keyframes slideInRight {
      0% { transform: translateX(100%); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }
    @keyframes slideOutRight {
      0% { transform: translateX(0); opacity: 1; }
      100% { transform: translateX(100%); opacity: 0; }
    }
    .toast-enter { animation: slideInRight 0.4s forwards; }
    .toast-exit { animation: slideOutRight 0.4s forwards; }
    
    .disabled-input { opacity: 0.6; cursor: not-allowed; background-color: #374151; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col overflow-hidden">

  <div id="app" class="flex-grow flex flex-col h-full">
    <div class="flex items-center justify-center h-full">
        <div class="text-slate-400 flex flex-col items-center">
            <div class="loader mb-2"></div>
            <p>Memuat Sistem...</p>
        </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-[9999] flex flex-col gap-3"></div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    // --- KONFIGURASI SUPABASE ---
    const SUPABASE_URL = "https://plovtqealsfydvoonvqn.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsb3Z0cWVhbHNmeWR2b29udnFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg2MzQ5MzMsImV4cCI6MjA4NDIxMDkzM30.-wL6cpOYwBnKdQMTxhNgzFnKwKdXlRx4fjlwan9pVHE";
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- UTILS ---
    const getLocalDateYYYYMMDD = () => {
      const now = new Date();
      const offset = now.getTimezoneOffset() * 60000; 
      const localDate = new Date(now.getTime() - offset);
      return localDate.toISOString().split('T')[0];
    }

    // --- STATE GLOBAL ---
    let currentGuru = null;
    let siswaBinaan = [];
    let isDemoMode = false;
    let activeView = 'KEHADIRAN'; // KEHADIRAN, PRESTASI, PELANGGARAN, JADWAL, NILAI, LAPORAN
    
    // State Kehadiran
    let tanggalDipilih = getLocalDateYYYYMMDD();
    let isEditMode = false;
    let schoolConfig = { hari_sekolah: 5 }; 
    let dateValidationState = { isValid: true, message: '' };

    // State Export
    let exportStartDate = new Date().toISOString().slice(0, 8) + '01'; // First day of current month
    let exportEndDate = getLocalDateYYYYMMDD();

    // State Nilai
    let pengajaranList = [];
    let selectedKelasId = '';
    let selectedMapelId = '';
    let selectedJenisNilai = 'FORMATIF'; // FORMATIF, SUMATIF, AKHIR_SUMATIF

    const app = document.getElementById("app");

    // --- SESSION ---
    const SESSION_KEY = 'gurwal_session_v1';

    function saveSession(guruData, demoMode = false) {
        localStorage.setItem(SESSION_KEY, JSON.stringify({ guru: guruData, isDemo: demoMode }));
    }

    function checkSession() {
        try {
            const stored = localStorage.getItem(SESSION_KEY);
            if (stored) {
                const session = JSON.parse(stored);
                if (session && session.guru) {
                    currentGuru = session.guru;
                    isDemoMode = !!session.isDemo;
                    initApp();
                    return;
                }
            }
        } catch (e) { localStorage.removeItem(SESSION_KEY); }
        renderLogin();
    }

    function logout() {
        localStorage.removeItem(SESSION_KEY);
        location.reload();
    }

    // --- INIT APP ---
    async function initApp() {
        // Load initial data
        await loadConfigData();
        if (!isDemoMode) {
            // Pre-fetch basic data if needed
            fetchPengajaran();
        } else {
            pengajaranList = [
                { id: 1, kelas: {id: 'k1', nama: 'X-A'}, mapel: {id: 'm1', nama: 'Matematika'} },
                { id: 2, kelas: {id: 'k1', nama: 'X-A'}, mapel: {id: 'm2', nama: 'Fisika'} },
                { id: 3, kelas: {id: 'k2', nama: 'XI-B'}, mapel: {id: 'm1', nama: 'Matematika'} }
            ];
        }
        
        // Render Layout
        renderLayout();
        navigateTo('KEHADIRAN');
    }

    async function loadConfigData() {
        if (isDemoMode) return;
        const { data } = await supabase.from('sekolah').select('hari_sekolah').limit(1).maybeSingle();
        if (data) schoolConfig.hari_sekolah = data.hari_sekolah;
    }

    async function fetchPengajaran() {
        const { data } = await supabase.from('pengajaran').select('*, kelas(id, nama), mapel(id, nama, kode)').eq('id_guru', currentGuru.id);
        if (data) pengajaranList = data;
    }

    // --- NAVIGATION ---
    window.navigateTo = (view) => {
        activeView = view;
        updateSidebarState();
        const contentEl = document.getElementById('mainContent');
        contentEl.innerHTML = `<div class="flex justify-center items-center h-64"><div class="loader"></div></div>`;
        
        setTimeout(() => {
            switch (view) {
                case 'KEHADIRAN': renderKehadiranPage(); break;
                case 'PRESTASI': renderPrestasiPage(); break;
                case 'PELANGGARAN': renderPelanggaranPage(); break;
                case 'JADWAL': renderJadwalPage(); break;
                case 'NILAI': renderNilaiPage(); break;
                case 'LAPORAN': renderLaporanPage(); break;
            }
        }, 100); // Small delay for UI feedback
    }

    function updateSidebarState() {
        document.querySelectorAll('.nav-item').forEach(el => {
            if (el.dataset.view === activeView) {
                el.classList.add('bg-indigo-600', 'text-white');
                el.classList.remove('text-slate-400', 'hover:bg-slate-800');
            } else {
                el.classList.remove('bg-indigo-600', 'text-white');
                el.classList.add('text-slate-400', 'hover:bg-slate-800');
            }
        });
        // Mobile Header Title
        const titleEl = document.getElementById('mobileTitle');
        if(titleEl) titleEl.innerText = activeView.replace('_', ' ');
    }

    // --- RENDERERS ---

    function renderLogin() {
        app.innerHTML = `
            <div class="flex items-center justify-center min-h-screen p-4 bg-slate-900">
                <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl shadow-2xl w-full max-w-md animate-fade-in">
                    <div class="text-center mb-8">
                        <div class="bg-indigo-600/20 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="ph ph-chalkboard-teacher text-3xl text-indigo-400"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-white">Login Guru Wali</h1>
                    </div>
                    <form id="loginForm" class="space-y-4">
                        <div>
                            <label class="block text-xs font-medium text-slate-400 uppercase mb-1">Username</label>
                            <input id="username" type="text" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-400 uppercase mb-1">Password</label>
                            <input id="password" type="password" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg transition">Masuk</button>
                    </form>
                    <p class="text-center text-xs text-slate-500 mt-4">Demo: demo / demo</p>
                </div>
            </div>
        `;
        document.getElementById('loginForm').addEventListener('submit', handleLogin);
    }

    function renderLayout() {
        app.innerHTML = `
            <div class="flex h-screen bg-slate-900 overflow-hidden">
                <!-- SIDEBAR -->
                <aside class="w-64 bg-slate-800 border-r border-slate-700 hidden md:flex flex-col z-20">
                    <div class="p-6 border-b border-slate-700">
                        <h2 class="text-lg font-bold text-white flex items-center gap-2">
                            <i class="ph ph-graduation-cap text-indigo-400"></i> GurWal
                        </h2>
                        <div class="mt-4 flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-white font-bold border border-slate-600">
                                ${currentGuru.nama.charAt(0)}
                            </div>
                            <div class="overflow-hidden">
                                <p class="text-sm font-bold text-white truncate">${currentGuru.nama}</p>
                                <p class="text-xs text-slate-400 truncate">${currentGuru.username}</p>
                            </div>
                        </div>
                    </div>
                    <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
                        ${renderMenuItem('KEHADIRAN', 'ph-calendar-check', 'Kehadiran')}
                        ${renderMenuItem('PRESTASI', 'ph-trophy', 'Prestasi')}
                        ${renderMenuItem('PELANGGARAN', 'ph-warning-circle', 'Pelanggaran')}
                        <div class="pt-4 pb-1 text-xs font-bold text-slate-500 uppercase px-3">Pengajaran</div>
                        ${renderMenuItem('JADWAL', 'ph-chalkboard', 'Daftar Kelas Ajar')}
                        ${renderMenuItem('NILAI', 'ph-exam', 'Input Nilai')}
                        <div class="pt-4 pb-1 text-xs font-bold text-slate-500 uppercase px-3">Laporan</div>
                        ${renderMenuItem('LAPORAN', 'ph-file-text', 'Laporan Binaan')}
                    </nav>
                    <div class="p-4 border-t border-slate-700">
                        <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-2 text-red-400 hover:bg-slate-700 rounded-lg transition">
                            <i class="ph ph-sign-out"></i> Logout
                        </button>
                    </div>
                </aside>

                <!-- MAIN -->
                <main class="flex-1 flex flex-col relative h-full overflow-hidden">
                    <!-- Mobile Header -->
                    <header class="md:hidden bg-slate-800 border-b border-slate-700 p-4 flex justify-between items-center z-20">
                        <h1 id="mobileTitle" class="font-bold text-white uppercase">Kehadiran</h1>
                        <button onclick="document.querySelector('aside').classList.toggle('hidden'); document.querySelector('aside').classList.toggle('absolute'); document.querySelector('aside').classList.toggle('h-full');" class="text-white">
                            <i class="ph ph-list text-2xl"></i>
                        </button>
                    </header>

                    <!-- Content -->
                    <div id="mainContent" class="flex-1 overflow-y-auto p-4 md:p-8 bg-slate-900 custom-scrollbar relative">
                        <!-- Content Injected Here -->
                    </div>
                </main>
            </div>
        `;
    }

    function renderMenuItem(view, icon, label) {
        return `
            <button onclick="navigateTo('${view}')" data-view="${view}" class="nav-item w-full flex items-center gap-3 px-4 py-2.5 rounded-lg font-medium transition text-left">
                <i class="ph ${icon} text-lg"></i> ${label}
            </button>
        `;
    }

    // --- PAGE RENDERERS ---

    // 1. KEHADIRAN (Original Logic)
    async function renderKehadiranPage() {
        const content = document.getElementById('mainContent');
        content.innerHTML = `
            <div class="max-w-4xl mx-auto space-y-6 fade-in">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-800 p-4 rounded-xl border border-slate-700">
                    <div>
                        <h2 class="text-xl font-bold text-white">Input Kehadiran</h2>
                        <p class="text-sm text-slate-400">Kelola absensi harian siswa binaan.</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <label class="text-sm text-slate-400">Tanggal:</label>
                        <input type="date" id="inputTanggal" value="${tanggalDipilih}" class="bg-slate-900 border border-slate-600 text-white rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <div id="dateAlertBox" class="hidden p-3 rounded-lg text-sm font-medium border"></div>

                <div id="siswaListContainer" class="bg-slate-800 rounded-xl border border-slate-700 shadow-lg overflow-hidden min-h-[200px]">
                    <div class="p-8 text-center text-slate-500"><div class="loader mx-auto mb-2"></div>Memuat...</div>
                </div>

                <div class="flex gap-3 justify-end sticky bottom-4 z-10">
                    <button id="btnHapus" class="hidden bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition flex items-center gap-2">
                        <i class="ph ph-trash"></i> Hapus
                    </button>
                    <button id="btnSimpan" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition flex items-center gap-2">
                        <i class="ph ph-floppy-disk"></i> <span id="btnSimpanText">Simpan Kehadiran</span>
                    </button>
                </div>
            </div>
        `;

        // Attach listeners
        document.getElementById('inputTanggal').addEventListener('change', (e) => {
            tanggalDipilih = e.target.value;
            loadSiswaList();
        });
        document.getElementById('btnSimpan').addEventListener('click', simpanKehadiran);
        document.getElementById('btnHapus').addEventListener('click', hapusKehadiran);

        loadSiswaList();
    }

    // 2. PRESTASI
    async function renderPrestasiPage() {
        const content = document.getElementById('mainContent');
        content.innerHTML = `
            <div class="max-w-4xl mx-auto space-y-6 fade-in">
                <div class="flex justify-between items-center bg-slate-800 p-6 rounded-xl border border-slate-700">
                    <h2 class="text-xl font-bold text-white">Catatan Prestasi</h2>
                    <button onclick="document.getElementById('formPrestasi').classList.toggle('hidden')" class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 transition">+ Tambah</button>
                </div>

                <div id="formPrestasi" class="hidden bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
                    <h3 class="text-lg font-bold text-white border-b border-slate-700 pb-2">Input Prestasi Baru</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <select id="presSiswa" class="bg-slate-900 border border-slate-600 text-white p-2.5 rounded-lg w-full">
                            <option value="">-- Pilih Siswa --</option>
                        </select>
                        <input type="date" id="presTanggal" class="bg-slate-900 border border-slate-600 text-white p-2.5 rounded-lg w-full" value="${getLocalDateYYYYMMDD()}">
                    </div>
                    <input type="text" id="presJudul" placeholder="Nama Prestasi / Lomba" class="bg-slate-900 border border-slate-600 text-white p-2.5 rounded-lg w-full">
                    <select id="presTingkat" class="bg-slate-900 border border-slate-600 text-white p-2.5 rounded-lg w-full">
                        <option value="Sekolah">Sekolah</option>
                        <option value="Kecamatan">Kecamatan</option>
                        <option value="Kabupaten">Kabupaten</option>
                        <option value="Provinsi">Provinsi</option>
                        <option value="Nasional">Nasional</option>
                    </select>
                    <button id="btnSavePrestasi" class="bg-emerald-600 text-white w-full py-2.5 rounded-lg font-bold hover:bg-emerald-700">Simpan Prestasi</button>
                </div>

                <div id="listPrestasi" class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
                    <div class="p-8 text-center text-slate-500">Memuat data...</div>
                </div>
            </div>
        `;

        // Populate Siswa Dropdown
        const siswaList = await fetchSiswaBinaan();
        const select = document.getElementById('presSiswa');
        siswaList.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.innerText = s.nama;
            select.appendChild(opt);
        });

        // Load Data
        loadPrestasiList();

        // Bind Save
        document.getElementById('btnSavePrestasi').onclick = async () => {
            const id_siswa = document.getElementById('presSiswa').value;
            const tanggal = document.getElementById('presTanggal').value;
            const deskripsi = document.getElementById('presJudul').value;
            const tingkat = document.getElementById('presTingkat').value;

            if(!id_siswa || !deskripsi) return showToast("Lengkapi data", "error");

            if(isDemoMode) {
                showToast("Simpan Prestasi Berhasil (Demo)");
                document.getElementById('formPrestasi').classList.add('hidden');
                return;
            }

            const { error } = await supabase.from('prestasi').insert([{id_guru: currentGuru.id, id_siswa, tanggal, deskripsi, tingkat}]);
            if(error) showToast("Gagal simpan", "error");
            else {
                showToast("Prestasi tersimpan");
                document.getElementById('formPrestasi').classList.add('hidden');
                loadPrestasiList();
            }
        };
    }

    async function loadPrestasiList() {
        const container = document.getElementById('listPrestasi');
        let data = [];
        if(isDemoMode) {
            data = [{id:1, tanggal: '2023-10-10', deskripsi: 'Juara 1 Lomba Lari', tingkat: 'Kabupaten', siswa: {nama: 'Andi Saputra'}}];
        } else {
            const res = await supabase.from('prestasi').select('*, siswa(nama)').eq('id_guru', currentGuru.id).order('tanggal', {ascending: false});
            data = res.data || [];
        }

        if(data.length === 0) {
            container.innerHTML = `<div class="p-8 text-center text-slate-500">Belum ada data prestasi.</div>`;
            return;
        }

        let html = `<table class="w-full text-left text-sm text-slate-300">
            <thead class="bg-slate-700 text-slate-100 font-bold"><tr><th class="p-4">Tanggal</th><th class="p-4">Siswa</th><th class="p-4">Prestasi</th><th class="p-4">Tingkat</th></tr></thead>
            <tbody class="divide-y divide-slate-700">`;
        data.forEach(item => {
            html += `<tr>
                <td class="p-4">${item.tanggal}</td>
                <td class="p-4 font-bold text-white">${item.siswa?.nama}</td>
                <td class="p-4">${item.deskripsi}</td>
                <td class="p-4"><span class="bg-yellow-600/20 text-yellow-400 px-2 py-1 rounded text-xs border border-yellow-600/50">${item.tingkat}</span></td>
            </tr>`;
        });
        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    // 3. PELANGGARAN
    async function renderPelanggaranPage() {
        const content = document.getElementById('mainContent');
        content.innerHTML = `
            <div class="max-w-4xl mx-auto space-y-6 fade-in">
                <div class="flex justify-between items-center bg-slate-800 p-6 rounded-xl border border-slate-700">
                    <h2 class="text-xl font-bold text-white">Catatan Pelanggaran</h2>
                    <button onclick="document.getElementById('formPelanggaran').classList.toggle('hidden')" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 transition">+ Catat</button>
                </div>

                <div id="formPelanggaran" class="hidden bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <select id="pelSiswa" class="bg-slate-900 border border-slate-600 text-white p-2.5 rounded-lg w-full">
                            <option value="">-- Pilih Siswa --</option>
                        </select>
                        <input type="date" id="pelTanggal" class="bg-slate-900 border border-slate-600 text-white p-2.5 rounded-lg w-full" value="${getLocalDateYYYYMMDD()}">
                    </div>
                    <textarea id="pelDeskripsi" placeholder="Deskripsi Pelanggaran" class="bg-slate-900 border border-slate-600 text-white p-2.5 rounded-lg w-full" rows="2"></textarea>
                    <input type="text" id="pelTindakan" placeholder="Tindakan / Sanksi" class="bg-slate-900 border border-slate-600 text-white p-2.5 rounded-lg w-full">
                    <button id="btnSavePelanggaran" class="bg-red-600 text-white w-full py-2.5 rounded-lg font-bold hover:bg-red-700">Simpan Pelanggaran</button>
                </div>

                <div id="listPelanggaran" class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
                    <div class="p-8 text-center text-slate-500">Memuat data...</div>
                </div>
            </div>
        `;

        const siswaList = await fetchSiswaBinaan();
        const select = document.getElementById('pelSiswa');
        siswaList.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.innerText = s.nama;
            select.appendChild(opt);
        });

        loadPelanggaranList();

        document.getElementById('btnSavePelanggaran').onclick = async () => {
            const id_siswa = document.getElementById('pelSiswa').value;
            const tanggal = document.getElementById('pelTanggal').value;
            const deskripsi = document.getElementById('pelDeskripsi').value;
            const tindakan = document.getElementById('pelTindakan').value;

            if(!id_siswa || !deskripsi) return showToast("Lengkapi data", "error");

            if(isDemoMode) {
                showToast("Simpan Berhasil (Demo)");
                return;
            }

            const { error } = await supabase.from('pelanggaran').insert([{id_guru: currentGuru.id, id_siswa, tanggal, deskripsi, tindakan}]);
            if(error) showToast("Gagal simpan", "error");
            else {
                showToast("Pelanggaran dicatat");
                document.getElementById('formPelanggaran').classList.add('hidden');
                loadPelanggaranList();
            }
        };
    }

    async function loadPelanggaranList() {

    async function loadFormNilai() {

        if(!id_kelas || !id_mapel) return showToast("Pilih Kelas dan Mapel", "error");

        const container = document.getElementById('nilaiContainer');
        const list = document.getElementById('listSiswaNilai');
        container.classList.remove('hidden');
        list.innerHTML = `<div class="p-8 text-center"><div class="loader mx-auto"></div></div>`;

        let students = [];
        let existingGrades = [];

        if(isDemoMode) {
            students = [{id:'s1', nama:'Andi', nisn:'123'}, {id:'s2', nama:'Budi', nisn:'456'}];
        } else {
            const sRes = await supabase.from('siswa').select('*').eq('id_kelas', id_kelas).order('nama');
            const nRes = await supabase.from('nilai').select('*').eq('id_guru', currentGuru.id).eq('id_mapel', id_mapel).eq('jenis', jenis);
            students = sRes.data || [];
            existingGrades = nRes.data || [];
        }

        if(students.length === 0) {
            list.innerHTML = `<div class="p-8 text-center text-slate-500">Tidak ada siswa di kelas ini.</div>`;
            return;
        }

        let html = `<table class="w-full text-left text-sm text-slate-300">
            <thead class="bg-slate-750 text-slate-400"><tr><th class="p-4">Nama Siswa</th><th class="p-4 w-32 text-center">Nilai (0-100)</th></tr></thead>
            <tbody class="divide-y divide-slate-700">`;
        
        students.forEach(s => {
            const grade = existingGrades.find(g => g.id_siswa === s.id)?.nilai || '';
            html += `<tr>
                <td class="p-4 text-white font-medium">${s.nama} <div class="text-xs text-slate-500">${s.nisn}</div></td>
                <td class="p-4 text-center">
                    <input type="number" min="0" max="100" data-id="${s.id}" value="${grade}" class="input-nilai w-24 bg-slate-900 border border-slate-600 rounded p-2 text-center text-white focus:border-indigo-500 outline-none">
                </td>
            </tr>`;
        });
        html += `</tbody></table>`;
        list.innerHTML = html;
    }

    async function saveNilaiBatch() {
        if(isDemoMode) return showToast("Simpan Berhasil (Demo)");
        
        const id_mapel = document.getElementById('filterMapel').value;
        const jenis = document.getElementById('filterJenis').value;
        const inputs = document.querySelectorAll('.input-nilai');
        const today = getLocalDateYYYYMMDD();
        
        const updates = [];
        inputs.forEach(inp => {
            const val = inp.value;
            if(val !== '') {
                // Upsert logic requires unique constraint or manual check. Assuming manual for safety.
                // Simplified: Insert new, if duplicate handling needed, use proper upsert logic on backend or loop.
                // Ideally backend has unique constraint on (id_guru, id_siswa, id_mapel, jenis).
                // Here we just fire inserts, hoping Supabase handles UPSERT or we assume insert.
                // Better: Delete old for this combo then insert (Simple but radical) or use .upsert()
                updates.push({
                    id_guru: currentGuru.id,
                    id_siswa: inp.dataset.id,
                    id_mapel: id_mapel,
                    jenis: jenis,
                    nilai: parseFloat(val),
                    tanggal: today
                });
            }
        });

        // Smart Upsert
        // We need to fetch ID if exists to update, else insert.
        // Or blindly upsert if unique key exists.
        // Assuming unique key on DB: (id_siswa, id_mapel, jenis, id_guru)
        
        // For simplicity in this static file:
        // We will loop and upsert individually or batch if supported.
        // Supabase upsert works if Primary Key is involved or ON CONFLICT.
        // We assume 'nilai' table might not have perfect unique constraint setup in all user DBs.
        // Let's do: Delete existing for these students & params -> Insert New.
        
        const studentIds = Array.from(inputs).map(i => i.dataset.id);
        
        // 1. Delete old
        await supabase.from('nilai').delete()
            .eq('id_guru', currentGuru.id)
            .eq('id_mapel', id_mapel)
            .eq('jenis', jenis)
            .in('id_siswa', studentIds);
            
        // 2. Insert new
        if(updates.length > 0) {
            const { error } = await supabase.from('nilai').insert(updates);
            if(error) showToast("Gagal simpan: " + error.message, "error");
            else showToast("Nilai berhasil disimpan");
        } else {
            showToast("Nilai kosong (dihapus)");
        }
    }

    async function loadSiswaList() {
      // VALIDASI TANGGAL
      dateValidationState = await validateDateAsync(tanggalDipilih);
      const isLocked = !dateValidationState.isValid;
      
      const alertBox = document.getElementById('dateAlertBox');
      const btnSimpan = document.getElementById('btnSimpan');
      const btnHapus = document.getElementById('btnHapus');

      if (alertBox) {
        if (isLocked) {
          alertBox.className = "mb-4 p-3 rounded-lg text-sm font-medium border bg-amber-900/30 border-amber-600/50 text-amber-200 block alert-enter";
          alertBox.innerText = dateValidationState.message;
        } else {
          alertBox.className = "hidden";
          alertBox.innerText = "";
        }
      }

      if (btnSimpan) btnSimpan.disabled = isLocked;
      if (btnHapus) btnHapus.disabled = isLocked;

      const container = document.getElementById('siswaListContainer');
      const btnText = document.getElementById('btnSimpanText');
      
      container.innerHTML = `<div class="p-8 text-center text-slate-500"><div class="loader mx-auto mb-2"></div>Memuat data siswa...</div>`;
      
      siswaBinaan = await fetchSiswaBinaan();
      
      if (siswaBinaan.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-500"><i class="ph ph-empty text-4xl mb-2"></i><p>Tidak ada siswa binaan ditemukan.</p></div>`;
        return;
      }

      let kehadiranMap = {};
      let hadirCount = 0;
      isEditMode = false;

      if (!isDemoMode) {
        const siswaIds = siswaBinaan.map(s => s.id);
        const { data: kehadiranList } = await supabase.from('kehadiran').select('id_siswa, status').eq('tanggal', tanggalDipilih).in('id_siswa', siswaIds);
        if (kehadiranList && kehadiranList.length > 0) {
          isEditMode = true;
          kehadiranList.forEach(k => {
             kehadiranMap[k.id_siswa] = k.status;
             if(k.status === 'HADIR') hadirCount++;
          });
        }
      } else {
        isEditMode = Math.random() > 0.5;
      }

      if (btnText && btnSimpan && btnHapus) {
        if (isLocked) {
             btnText.innerText = "Input Dikunci";
             btnSimpan.classList.add('bg-slate-600'); 
             btnSimpan.classList.remove('bg-emerald-600', 'bg-blue-600');
             btnHapus.classList.add('hidden');
        } else {
            btnText.innerText = isEditMode ? "Update Kehadiran" : "Simpan Kehadiran";
            if(isEditMode) {
              btnSimpan.className = "bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition flex items-center gap-2";
              btnHapus.classList.remove('hidden');
            } else {
              btnSimpan.className = "bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg transition flex items-center gap-2";
              btnHapus.classList.add('hidden');
            }
        }
      }

      let html = '<div class="divide-y divide-slate-700">';
      const statusOptions = [{ val: 'HADIR', label: '🟢 Hadir' }, { val: 'IZIN', label: '🟡 Izin' }, { val: 'ALPA', label: '🔴 Alpa' }, { val: 'SAKIT', label: '🔵 Sakit' }];

      for (const s of siswaBinaan) {
        const savedStatus = kehadiranMap[s.id]; 
        const currentStatus = savedStatus || 'HADIR'; 
        const selectClass = savedStatus ? "border-blue-500 bg-blue-900/20 ring-1 ring-blue-500/50 text-blue-100 font-medium" : "bg-slate-900 border-slate-600 text-slate-300";
        const disabledAttr = isLocked ? 'disabled' : '';
        const cursorClass = isLocked ? 'disabled-input' : 'cursor-pointer';
        
        const optionsHtml = statusOptions.map(opt => {
            const isSelected = currentStatus === opt.val;
            const labelText = (savedStatus === opt.val) ? `${opt.label} ✓` : opt.label;
            return `<option value="${opt.val}" ${isSelected ? 'selected' : ''}>${labelText}</option>`;
        }).join('');

        html += `
          <div class="p-4 hover:bg-slate-750 transition flex flex-col sm:flex-row sm:items-center justify-between gap-4 group">
            <div class="flex items-center gap-4">
              <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-slate-300 font-bold">
                ${s.nama.charAt(0)}
              </div>
              <div>
                <p class="font-medium text-white">${s.nama}</p>
                <p class="text-sm text-slate-400 font-mono">${s.nisn || '-'}</p>
              </div>
            </div>
            <div class="w-full sm:w-48 relative">
              <select id="status-${s.id}" ${disabledAttr} class="w-full border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none transition-all ${selectClass} ${cursorClass}">${optionsHtml}</select>
            </div>
          </div>
        `;
      }
      html += '</div>';
      container.innerHTML = html;
    }

    async function simpanKehadiran() {
      if (!dateValidationState.isValid) { showToast(dateValidationState.message, "error"); return; }
      if(isDemoMode) { showToast("Simpan Berhasil (Demo)"); return; }

      const btn = document.getElementById('btnSimpan');
      const originalText = btn.innerHTML;
      btn.innerText = "Memproses...";
      btn.disabled = true;

      try {
        const siswaIds = siswaBinaan.map(s => s.id);
        const { data: existingData } = await supabase.from('kehadiran').select('id, id_siswa').eq('tanggal', tanggalDipilih).in('id_siswa', siswaIds);
        const existingMap = {};
        existingData?.forEach(e => existingMap[e.id_siswa] = e.id);
        const updates = [];
        const inserts = [];

        siswaBinaan.forEach(s => {
          const status = document.getElementById(`status-${s.id}`).value;
          if (existingMap[s.id]) {
            updates.push(supabase.from('kehadiran').update({ status }).eq('id', existingMap[s.id]));
          } else {
            inserts.push({ id_siswa: s.id, id_guru: currentGuru.id, tanggal: tanggalDipilih, status: status });
          }
        });

        if (updates.length > 0) await Promise.all(updates);
        if (inserts.length > 0) await supabase.from('kehadiran').insert(inserts);

        showToast("Kehadiran disimpan", "success");
        loadSiswaList();
      } catch (err) {
        showToast("Gagal menyimpan: " + err.message, "error");
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    async function hapusKehadiran() {
        if (!confirm("Hapus data kehadiran tanggal ini?")) return;
        if(isDemoMode) { showToast("Data Dihapus (Demo)"); loadSiswaList(); return; }
        
        try {
            await supabase.from('kehadiran').delete().eq('id_guru', currentGuru.id).eq('tanggal', tanggalDipilih);
            showToast("Data dihapus");
            loadSiswaList();
        } catch(e) { showToast("Gagal hapus", "error"); }
    }

    checkSession();
